<!doctype html><html><meta name="viewport" content="width=device-width, initial-scale=1"><title>Harmony Preview Check</title><style>body{font:24px system-ui;margin:30px;background:#f5f6fa;color:#192434}button,input{font:inherit;padding:16px;border-radius:12px;border:1px solid #bbb}button{background:#2859dd;color:white}p{padding:10px}#clock{color:#555}</style><h1>Remote preview</h1><p id="clock"></p><button onclick="count++;document.querySelector('#result').textContent='Clicked '+count">Tap test</button><p id="result">Waiting for tap</p><input placeholder="Type here" oninput="document.querySelector('#typed').textContent=this.value"><p id="typed"></p><script>let count=0;setInterval(()=>document.querySelector('#clock').textContent='Live '+new Date().toLocaleTimeString(),1000)</script></html>
